<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repo-reaper graph</title>
<script src="__VIS__"></script>
<style>
  /* Colour tokens: light = the Phase 8/9 look; dark when the OS asks for it (Auto) or the Theme
     select says Dark (data-theme on <html>, kept in localStorage). Both dark blocks are the same. */
  :root { --bg: #fff; --fg: #222; --line: #ddd; --muted: #555; --faint: #777; --error: #b00020;
          --link: #1f5a96; --hover: #eef3f8; --badge: #e8f0e8; --badge-fg: #333; --badge-inf: #fdebd3;
          --badge-amb: #f3e0e0; --stale: #f8d7da; --stale-fg: #b00020; --llm-bg: #faf7fb; --chip: #f6f6f6;
          --chip-line: #ccc; --branch: #b0b0b0; --tip: #f5f4ed; --tip-fg: #000000; --tip-line: #808074; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg: #1a1a19; --fg: #e8e6e0; --line: #3a3a37;
          --muted: #c3c2b7; --faint: #898781; --error: #ff6b7f; --link: #7ab4f0; --hover: #26323e;
          --badge: #2b3a2b; --badge-fg: #e8e6e0; --badge-inf: #3d2f1c; --badge-amb: #3d2626; --stale: #3a1d22;
          --stale-fg: #ff8a95; --llm-bg: #2a2230; --chip: #262624; --chip-line: #4a4945; --branch: #5f5e5a;
          --tip: #2c2c2a; --tip-fg: #f0efec; --tip-line: #6b6a65; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #1a1a19; --fg: #e8e6e0; --line: #3a3a37;
          --muted: #c3c2b7; --faint: #898781; --error: #ff6b7f; --link: #7ab4f0; --hover: #26323e;
          --badge: #2b3a2b; --badge-fg: #e8e6e0; --badge-inf: #3d2f1c; --badge-amb: #3d2626; --stale: #3a1d22;
          --stale-fg: #ff8a95; --llm-bg: #2a2230; --chip: #262624; --chip-line: #4a4945; --branch: #5f5e5a;
          --tip: #2c2c2a; --tip-fg: #f0efec; --tip-line: #6b6a65; }
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  body { display: grid; grid-template: auto 1fr / 260px minmax(0,1fr) 340px; height: 100vh; }
  [hidden] { display: none !important; }
  #bar { grid-column: 1 / -1; padding: 6px 10px; border-bottom: 1px solid var(--line); display: flex;
         gap: 10px; flex-wrap: wrap; align-items: center; }
  #side { grid-column: 1; min-height: 0; overflow: auto; padding: 8px 10px; border-right: 1px solid var(--line); }
  #net { grid-column: 2; min-height: 0; min-width: 0; }
  /* Graph and Tree share one cell; the hidden one keeps its size, camera and positions. */
  #net, #tree { grid-row: 2; }
  #tree { grid-column: 2; min-height: 0; min-width: 0; }
  .off { visibility: hidden; }
  .modes button.active { background: #4c78a8; color: #fff; }
  #panel { grid-column: 3; min-height: 0; overflow: auto; padding: 8px 10px; border-left: 1px solid var(--line); }
  #status { color: var(--muted); }
  #status.error { color: var(--error); font-weight: bold; }
  #theme-pick { margin-left: auto; }
  #search { width: 100%; box-sizing: border-box; margin: 4px 0; }
  #results { margin: 0 0 8px; padding-left: 22px; }
  #legend h3, #panel h3 { font-size: 13px; margin: 10px 0 4px; color: var(--muted); }
  #legend label { display: flex; align-items: center; gap: 4px; }
  .count { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
  .sw.box { border-radius: 2px; }
  .kind-file { background: #4c78a8; }
  .kind-class { background: #b279a2; }
  .kind-function { background: #54a24b; }
  .kind-method { background: #72b7b2; }
  .kind-external { background: #79706e; }
  .k { display: inline-block; width: 18px; border-top: 3px solid; }
  .k.inferred { border-top-style: dashed; }
  .k.ambiguous { border-top-style: dotted; opacity: 0.5; }
  .k.e-contains { border-color: var(--branch); }
  .k.e-imports { border-color: #4c78a8; }
  .k.e-inherits { border-color: #b279a2; }
  .k.e-calls { border-color: #f58518; }
  .k.conf { border-color: var(--muted); }
  .hops button.active { background: #4c78a8; color: #fff; }
  .tabs button { margin-right: 4px; }
  .hint { color: var(--faint); }
  #results li { margin: 1px 0; }
  #results button.row { display: block; width: 100%; text-align: left; border: 0; background: none;
                        padding: 2px 4px; cursor: pointer; font: inherit; }
  #results button.row:hover, #results button.row:focus { background: var(--hover); }
  .row .kind { color: var(--faint); margin-left: 6px; font-size: 12px; }
  .row .rid { display: block; color: var(--faint); font-size: 11px; overflow-wrap: anywhere; }
  .tabs button.active { background: #4c78a8; color: #fff; }
  .badge { display: inline-block; font-size: 11px; padding: 0 4px; margin-left: 4px; border-radius: 3px;
           background: var(--badge); color: var(--badge-fg); }
  .badge[data-conf=INFERRED] { background: var(--badge-inf); }
  .badge[data-conf=AMBIGUOUS] { background: var(--badge-amb); }
  .badge.stale { background: var(--stale); color: var(--stale-fg); }
  #details .meta { color: var(--muted); margin: 2px 0; overflow-wrap: anywhere; }
  #details .doc { white-space: pre-wrap; margin: 6px 0; }
  .llm-block { border-left: 3px solid #b279a2; background: var(--llm-bg); padding: 2px 8px; margin: 8px 0; }
  .rel { list-style: none; margin: 0; padding: 0; }
  .rel button { border: 0; background: none; padding: 1px 0; color: var(--link); cursor: pointer; font: inherit;
                text-align: left; overflow-wrap: anywhere; }
  .rel button:hover { text-decoration: underline; }
  body.llm-off .llm { display: none !important; }
  #legend .grow { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  #legend .gsum { color: var(--muted); font-size: 12px; margin: 0 0 2px 16px; }
  #arch .item { margin: 6px 0 10px; }
  #arch .item p { margin: 2px 0; }
  .chip { font: 11px ui-monospace, monospace; margin: 2px 4px 0 0; padding: 1px 4px; cursor: pointer;
          border: 1px solid var(--chip-line); border-radius: 3px; background: var(--chip); overflow-wrap: anywhere; }
  /* vis injects its tooltip CSS after this sheet; the html prefix wins (light = vis defaults). */
  html div.vis-tooltip { background-color: var(--tip); color: var(--tip-fg); border-color: var(--tip-line); }
</style>
</head>
<body>
<div id="bar">
  <strong>repo-reaper</strong>
  <span class="modes"><button id="mode-graph" class="active">Graph</button><button id="mode-tree" disabled title="Editor-style tree, left to right">Tree</button></span>
  <span class="hops">Hops <button data-hops="1" class="active">1</button><button data-hops="2">2</button><button data-hops="3">3</button></span>
  <button id="clear-focus">Clear focus</button>
  <button id="fit">Fit</button>
  <button id="collapse-all" hidden>Collapse all</button>
  <button id="relayout">Re-layout</button>
  <label id="llm-toggle" hidden><input type="checkbox" checked> LLM layer</label>
  <span id="status">Loading vis-network 9.1.9 ...</span>
  <label id="theme-pick" title="Colour theme; Auto follows the system setting">Theme <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
</div>
<div id="side">
  <label for="search"><strong>Search</strong></label>
  <input id="search">
  <ol id="results"></ol>
  <div id="legend">
    <h3>Nodes</h3>
    <label><input type="checkbox" data-node-kind="file" checked> <span class="sw box kind-file"></span> file <span class="count"></span></label>
    <label><input type="checkbox" data-node-kind="class" checked> <span class="sw kind-class"></span> class <span class="count"></span></label>
    <label><input type="checkbox" data-node-kind="function" checked> <span class="sw kind-function"></span> function <span class="count"></span></label>
    <label><input type="checkbox" data-node-kind="method" checked> <span class="sw kind-method"></span> method <span class="count"></span></label>
    <label><input type="checkbox" data-node-kind="external" checked> <span class="sw box kind-external"></span> external <span class="count"></span></label>
    <h3>Edges</h3>
    <label><input type="checkbox" data-edge-kind="contains" checked> <span class="k e-contains"></span> contains <span class="count"></span></label>
    <label><input type="checkbox" data-edge-kind="imports" checked> <span class="k e-imports"></span> imports <span class="count"></span></label>
    <label><input type="checkbox" data-edge-kind="inherits" checked> <span class="k e-inherits"></span> inherits <span class="count"></span></label>
    <label><input type="checkbox" data-edge-kind="calls" checked> <span class="k e-calls"></span> calls <span class="count"></span></label>
    <h3>Confidence</h3>
    <label><input type="checkbox" data-conf="EXTRACTED" checked> <span class="k conf"></span> EXTRACTED <span class="count"></span></label>
    <label><input type="checkbox" data-conf="INFERRED" checked> <span class="k conf inferred"></span> INFERRED <span class="count"></span></label>
    <label><input type="checkbox" data-conf="AMBIGUOUS" checked> <span class="k conf ambiguous"></span> AMBIGUOUS <span class="count"></span></label>
  </div>
</div>
<div id="net"></div>
<div id="tree" class="off"></div>
<div id="panel">
  <div class="tabs"><button id="tab-details">Details</button><button id="tab-arch" class="llm" hidden>Architecture (LLM-generated)</button></div>
  <div id="details"><p class="hint">Select a node to see its details.</p></div>
  <div id="arch" class="llm" hidden></div>
</div>
<script id="graph-data" type="application/json">__DATA__</script>
<script>
// Data and LLM text reach the DOM only through textContent / createElement (never as markup).
// Top level: parse D, style D.edges, build indexes, set state, define functions, boot().
const D = JSON.parse(document.getElementById("graph-data").textContent);

const NODE_KINDS = ["file", "class", "function", "method", "external"];
const EDGE_KINDS = ["contains", "imports", "inherits", "calls"];
const CONFS = ["EXTRACTED", "INFERRED", "AMBIGUOUS"];
const SYMBOL_KINDS = new Set(["class", "function", "method"]);
const KIND_COLOR = {file: "#4c78a8", class: "#b279a2", function: "#54a24b", method: "#72b7b2",
                    external: "#79706e"};
const EDGE_COLORS = {contains: "#b0b0b0", imports: "#4c78a8", inherits: "#b279a2", calls: "#f58518"};
const DASH = {INFERRED: [8, 6], AMBIGUOUS: [2, 4]};
const BUNDLE_COLOR = "#888";
const RELAYOUT_MS = 3000;
const MAX_RESULTS = 30;
// Group colours of the LLM layer (cycled); files in no group are grey, externals keep KIND_COLOR.
const GROUP_COLORS = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b", "#e377c2",
                      "#17becf", "#bcbd22", "#393b79", "#637939", "#8c6d31", "#843c39", "#7b4173"];
// Dark mode keeps these hues; the 4 below 3:1 on the dark surface use their lighter tab20 sibling.
const GROUP_COLORS_DARK = GROUP_COLORS.map(c => ({"#8c564b": "#c49c94", "#393b79": "#6b6ecf",
                                                  "#843c39": "#d6616b", "#7b4173": "#ce6dbd"})[c] || c);
// Canvas colours per theme (CSS tokens on :root cover the rest of the page). Light = the Phase 8/9
// look: vis's default label ink #343434 without a halo and vis's own selection look. Dark: light
// labels with a halo in the surface colour, quiet branch lines and no-group files, dark folder boxes
// and a light ring on the selected / hovered node (vis's darkened border vanishes on dark).
const INKS = {
  light: {surface: "#ffffff", label: "#343434", halo: 0, branch: "#b0b0b0", noGroup: "#c7c7c7",
          groups: GROUP_COLORS, dir: {background: "#eeeeee", border: "#9e9e9e"}, dirLabel: "#222",
          ring: null},
  dark: {surface: "#1a1a19", label: "#f0efec", halo: 3, branch: "#5f5e5a", noGroup: "#6b6a65",
         groups: GROUP_COLORS_DARK, dir: {background: "#2c2c2a", border: "#6b6a65"}, dirLabel: "#f0efec",
         ring: {selected: "#ffffff", hover: "#c3c2b7"}}
};
// Theme choice: "auto" (follow the OS), "light" or "dark", kept in localStorage under THEME_KEY.
const THEME_KEY = "reaper-theme";
const DARK_MQ = typeof matchMedia === "function" ? matchMedia("(prefers-color-scheme: dark)") : null;
const DEBOUNCE_MS = 120;
const JSDELIVR_URL = "https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js";
const JSDELIVR_SRI = "sha384-yxKDWWf0wwdUj/gPeuL11czrnKFQROnLgY8ll7En9NYoXibgg3C6NK/UDHNtUgWJ";
// Tree mode: one column per depth (x), one row per shown node in tree order (y). ROW leaves room
// for the label under a dot.
const COL = 260;
const ROW = 40;
// Tree mode's page-only folder nodes (never in graph.json) have ids "dir:<path>/"; real ids never
// start with "dir:".
const DIR_PREFIX = "dir:";
// Tree mode edge curves: contains links (and the folder branches) are the tree's branches, thin and
// grey without arrows; imports, calls and inherits (and file-level bundles) bend over the tree.
const BRANCH_SMOOTH = {enabled: true, type: "cubicBezier", forceDirection: "horizontal"};
const RELATION_SMOOTH = {enabled: true, type: "curvedCW", roundness: 0.25};
// Node styles by kind (Graph mode, Phase 8). Box labels sit inside the box, so they get no halo.
const GRAPH_GROUPS = {
  file: {color: KIND_COLOR.file, size: 16, shape: "box", font: {color: "#fff", strokeWidth: 0}},
  class: {color: KIND_COLOR.class}, function: {color: KIND_COLOR.function},
  method: {color: KIND_COLOR.method}, external: {color: KIND_COLOR.external, shape: "diamond"}
};

let themePref = savedTheme();
let DARK = isDark(themePref);
let INK = INKS[DARK ? "dark" : "light"];

function savedTheme() {
  try {
    const t = localStorage.getItem(THEME_KEY);
    return t === "light" || t === "dark" ? t : "auto";
  } catch (e) {
    return "auto";  // no storage (node tests, some file:// setups)
  }
}

function isDark(pref) {
  return pref === "dark" || (pref === "auto" && !!(DARK_MQ && DARK_MQ.matches));
}

// Tree mode node styles: the Graph mode look plus folder boxes in the theme's colours.
function treeGroups() {
  return {...GRAPH_GROUPS,
          dir: {shape: "box", color: {...INK.dir}, font: {color: INK.dirLabel, strokeWidth: 0}}};
}

// vis node label font of the theme (light = vis defaults; dark adds a halo over crossing edges).
function nodeFont() {
  return {size: 12, color: INK.label, strokeWidth: INK.halo, strokeColor: INK.surface};
}

// vis "chosen" of the theme: light keeps vis's own look; dark draws the ring (bold label kept).
// Always an object: vis copies a node's object options when it creates the node, so a later
// `chosen: true` would not reach nodes made under the dark object; an object is updated in place.
function nodeChosen() {
  if (!INK.ring) return {node: true, label: true};
  const ring = INK.ring;
  return {label: true, node: (values, id, selected, hovering) => {
    values.borderColor = selected ? ring.selected : ring.hover;
    values.borderWidth = selected ? 3 : 2;
  }};
}

// INFERRED and AMBIGUOUS are drawn differently: own dash pattern, AMBIGUOUS also half transparent.
// contains links take the theme's branch colour (light = the colour outputs.py writes).
for (const e of D.edges) {
  if (e.kind === "contains") e.color = INK.branch;
  if (e.confidence === "EXTRACTED") continue;
  e.dashes = DASH[e.confidence] || true;
  if (e.confidence === "AMBIGUOUS") e.color = {color: e.color, opacity: 0.5};
}

const byId = new Map(D.nodes.map(n => [n.id, n]));
const edgeById = new Map(D.edges.map(e => [e.id, e]));
const bundleById = new Map(D.file_edges.map(f => [f.id, f]));
// Hop focus walks non-contains edges in both directions.
const adj = new Map();
for (const e of D.edges) {
  if (e.kind === "contains") continue;
  for (const end of [e.from, e.to]) {
    if (!adj.has(end)) adj.set(end, []);
    adj.get(end).push(e);
  }
}
// file -> its class/function/method ids (ring placement when the file is expanded).
const symbolsOf = new Map();
for (const n of D.nodes) {
  if (!SYMBOL_KINDS.has(n.kind) || !n.file) continue;
  if (!symbolsOf.has(n.file)) symbolsOf.set(n.file, []);
  symbolsOf.get(n.file).push(n.id);
}
// Tree mode: page-only folders (id -> vis node) and each node's tree parent: the contains edge
// source (file -> class/function, class -> method), a file's folder, a folder's parent folder.
const DIRS = new Map();
const parentOf = new Map();
for (const n of D.nodes) {
  if (n.kind !== "file") continue;
  const parts = n.id.split("/");
  let child = n.id;
  for (let k = parts.length - 1; k > 0; k--) {
    const dir = DIR_PREFIX + parts.slice(0, k).join("/") + "/";
    parentOf.set(child, dir);
    if (DIRS.has(dir)) break;
    DIRS.set(dir, {id: dir, label: parts[k - 1], group: "dir", title: dir.slice(DIR_PREFIX.length)});
    child = dir;
  }
}
for (const e of D.edges) {
  if (e.kind === "contains") parentOf.set(e.to, e.from);
}
// Tree mode's page-only branch edges folder -> subfolder / file; drawn while treeLayout lists them.
const BRANCH_EDGES = [...parentOf].filter(([, p]) => DIRS.has(p))
  .map(([child, p]) => ({id: "b:" + child, from: p, to: child, kind: "contains", ...branchLook()}));

// Panel relation sections: edge kind -> [section for the source, section for the target].
const REL = {calls: ["callees", "callers"], imports: ["imports", "imported by"],
             inherits: ["bases", "subclasses"], contains: ["contains", "contained in"]};
const REL_ORDER = ["callers", "callees", "imports", "imported by", "bases", "subclasses", "contains",
                   "contained in"];

// LLM groups: file id -> index in groupRows() (first group wins); empty without semantic.json.
const groupOf = new Map();
groupRows().forEach((r, i) => { for (const m of r.members) if (!groupOf.has(m)) groupOf.set(m, i); });

// Search keys, lower-cased once: name, id, signature (+ degree for the tie-break).
const searchKeys = D.nodes.map(n => ({id: n.id, deg: n.deg || 0, name: String(n.name || "").toLowerCase(),
                                      lid: n.id.toLowerCase(),
                                      sig: String(n.signature || "").toLowerCase()}));

const state = {kinds: new Set(NODE_KINDS), ekinds: new Set(EDGE_KINDS), conf: new Set(CONFS),
               hops: 1, center: null, focus: null, selected: null, expanded: new Set()};

// Assigned in start() (vis loaded). shown = the visible sets V of the last refresh();
// placed = state.expanded at the last refresh (files whose symbols already have a ring).
let net = null, nodes = null, edges = null, nodeView = null, edgeView = null;
let shown = null, placed = new Set();
// The tab the panel shows: "details" or "arch".
let activeTab = "details";
// LLM layer switch (setLLM); Tree mode colours its nodes from it when it is first built.
let llmOn = true;
// [swatch element, group index (-1 = no group)] of the group legend, recoloured by applyTheme().
const groupSwatches = [];
// Graph | Tree. `net` is the network shown (pick, Fit and the deep link act on it); graphNet is
// the Phase 8 network, the t* variables are Tree mode's (built on first use); tree =
// treeLayout(tshown). seenSel = the selection when each mode was last left.
let mode = "graph", graphNet = null, tnet = null, tnodes = null, tedges = null, tnodeView = null,
    tedgeView = null, tshown = null, tree = null;
const seenSel = {graph: null, tree: null};

function fileOf(id) {
  const n = byId.get(id);
  return (n && n.file) || id;
}

// ---------------------------------------------------------------- pure view logic (no DOM, no vis)

// The part of a bundle that passes the edge-kind and confidence filters:
// parts = [[kind, n, [[confidence, k], ...]], ...] (kinds alphabetical, zeros left out).
function bundleParts(f) {
  const parts = [];
  let total = 0;
  for (const kind of Object.keys(f.counts).sort()) {
    if (!state.ekinds.has(kind)) continue;
    const confs = CONFS.filter(c => state.conf.has(c) && f.counts[kind][c]).map(c => [c, f.counts[kind][c]]);
    const n = confs.reduce((sum, c) => sum + c[1], 0);
    if (n > 0) {
      parts.push([kind, n, confs]);
      total += n;
    }
  }
  return {parts, total};
}

// Visible ids: nodes, raw edges (e<i>) and file-level bundles (f<i>).
function applyView() {
  const vn = new Set(), raw = new Set(), agg = new Set();
  for (const n of D.nodes) {
    if (n.id === state.selected ||
        (state.kinds.has(n.kind) && (!state.focus || state.focus.has(n.id)) &&
         (!D.lod || n.kind === "file" || n.kind === "external" || state.expanded.has(n.file)))) {
      vn.add(n.id);
    }
  }
  for (const e of D.edges) {
    if (state.ekinds.has(e.kind) && state.conf.has(e.confidence) && vn.has(e.from) && vn.has(e.to) &&
        (!D.lod || (state.expanded.has(fileOf(e.from)) && state.expanded.has(fileOf(e.to))))) {
      raw.add(e.id);
    }
  }
  if (D.lod) {
    for (const f of D.file_edges) {
      if (!(state.expanded.has(f.from) && state.expanded.has(f.to)) && vn.has(f.from) && vn.has(f.to) &&
          bundleParts(f).total > 0) {
        agg.add(f.id);
      }
    }
  }
  return {nodes: vn, raw, agg};
}

function baseName(id) {
  return id.slice(id.lastIndexOf("/") + 1);
}

function branchLook() {
  return {color: INK.branch, width: 1, arrows: {to: {enabled: false}}, smooth: {...BRANCH_SMOOTH}};
}

// Label drawn in Tree mode: a file shows its basename (its folder is drawn above it); everything
// else keeps its label. Graph mode, search results and the panel keep n.label.
function treeLabel(n) {
  return n.kind === "file" ? baseName(n.id) : n.label;
}

// Tree mode node items (copies; D.nodes stays as Graph mode uses it): tree labels, then the
// folders. No colour here: placeTree() sends the LLM colours with every position (llmColour).
function treeNodeItems() {
  return D.nodes.map(n => ({...n, label: treeLabel(n)})).concat([...DIRS.values()]);
}

// A file-level bundle as a Tree mode edge: bends like a relation, styled by bundleStyle().
function bundleEdge(f) {
  return {id: f.id, from: f.from, to: f.to, smooth: {...RELATION_SMOOTH}, ...bundleStyle(f)};
}

// Tree mode edge items (copies; D.edges stays as Graph mode uses it): contains = branch look,
// relations bend; Phase 8 colours and dashes kept; then the folder branches and the bundles.
function treeEdgeItems() {
  return D.edges.map(e => ({...e, ...(e.kind === "contains" ? branchLook() : {smooth: {...RELATION_SMOOTH}})}))
    .concat(BRANCH_EDGES, D.file_edges.map(bundleEdge));
}

// Tree mode sibling order: folders, then files (A-Z by lower-case name, then exact name), then
// symbols in source order (file, line, id).
function treeKey(id) {
  const d = DIRS.get(id);
  if (d) return [0, d.label.toLowerCase(), d.label];
  const n = byId.get(id);
  if (n.kind === "file") return [1, baseName(n.id).toLowerCase(), baseName(n.id)];
  return [2, n.file || "", n.line || 0, n.id];
}

function keyCmp(a, b) {
  for (let i = 0; i < a.length; i++) {
    if (a[i] < b[i]) return -1;
    if (a[i] > b[i]) return 1;
  }
  return 0;
}

function byTree(ids) {
  return ids.map(id => [treeKey(id), id]).sort((a, b) => keyCmp(a[0], b[0])).map(x => x[1]);
}

// Tree mode positions of the visible sets V (pure): depth-first over folders -> files -> classes
// and functions -> methods; x = depth * COL, y = row * ROW. A node whose parent is hidden hangs
// under its nearest visible ancestor; a folder is shown when it holds a shown node. Externals form
// one block after a blank row. branches = page-only folder -> subfolder / file edges
// ("b:<child id>"), only while "contains" is enabled. Returns {pos: {id: {x, y}}, dirs, branches}.
function treeLayout(V) {
  const kids = new Map(), roots = [], ext = [], dirs = new Set(), branches = new Set();
  const hang = id => {
    let p = parentOf.get(id);
    while (p !== undefined && !V.nodes.has(p) && !DIRS.has(p)) p = parentOf.get(p);
    if (p === undefined) {
      roots.push(id);
      return;
    }
    if (!kids.has(p)) kids.set(p, []);
    kids.get(p).push(id);
    if (!DIRS.has(p)) return;
    if (state.ekinds.has("contains") && (DIRS.has(id) || byId.get(id).kind === "file")) branches.add("b:" + id);
    if (!dirs.has(p)) {
      dirs.add(p);
      hang(p);
    }
  };
  for (const id of V.nodes) {
    if (byId.get(id).kind === "external") ext.push(id);
    else hang(id);
  }
  const pos = {};
  let row = 0;
  const walk = (id, depth) => {
    pos[id] = {x: depth * COL, y: row * ROW};
    row += 1;
    for (const k of byTree(kids.get(id) || [])) walk(k, depth + 1);
  };
  for (const id of byTree(roots)) walk(id, 0);
  if (row && ext.length) row += 1;
  for (const id of ext.sort()) {
    pos[id] = {x: 0, y: row * ROW};
    row += 1;
  }
  return {pos, dirs, branches};
}

// Look of a file-level bundle from its enabled edges (follows the filters like the legend):
// width encodes the count (1 + log2, capped at 8), dashes and opacity follow its best
// confidence, colour = the edge-kind colour when it carries one kind, else grey.
function bundleStyle(f) {
  const {parts, total} = bundleParts(f);
  const best = CONFS.find(c => parts.some(p => p[2].some(x => x[0] === c)));
  const base = parts.length === 1 ? (EDGE_COLORS[parts[0][0]] || BUNDLE_COLOR) : BUNDLE_COLOR;
  const detail = parts.map(([kind, n, confs]) =>
    kind + " " + n + ": " + confs.map(([c, k]) => c + " " + k).join(", ")).join("; ");
  return {
    dashes: best === "INFERRED" || best === "AMBIGUOUS" ? DASH[best] : false,
    color: best === "AMBIGUOUS" ? {color: base, opacity: 0.5} : base,
    width: total > 0 ? Math.min(8, 1 + Math.log2(total)) : 1,
    title: f.from + " -> " + f.to + ": " + total + (total === 1 ? " edge" : " edges") +
           (detail ? " (" + detail + ")" : "")
  };
}

function zeros(keys) {
  const o = {};
  for (const k of keys) o[k] = 0;
  return o;
}

// Legend counts of what is shown; a bundle adds its enabled edges, lines = drawn edges.
function legendCounts(V) {
  const c = {node: zeros(NODE_KINDS), edge: zeros(EDGE_KINDS), conf: zeros(CONFS),
             lines: V.raw.size + V.agg.size};
  for (const id of V.nodes) c.node[byId.get(id).kind] += 1;
  for (const id of V.raw) {
    const e = edgeById.get(id);
    c.edge[e.kind] += 1;
    c.conf[e.confidence] += 1;
  }
  for (const id of V.agg) {
    for (const [kind, , confs] of bundleParts(bundleById.get(id)).parts) {
      for (const [conf, k] of confs) {
        c.edge[kind] += k;
        c.conf[conf] += k;
      }
    }
  }
  return c;
}

// Ids within `hops` steps of id, undirected, over the enabled non-contains edges.
function bfs(id, hops) {
  const seen = new Set([id]);
  let frontier = [id];
  for (let h = 0; h < hops && frontier.length; h++) {
    const next = [];
    for (const x of frontier) {
      for (const e of adj.get(x) || []) {
        if (!state.ekinds.has(e.kind) || !state.conf.has(e.confidence)) continue;
        const y = e.from === x ? e.to : e.from;
        if (!seen.has(y)) {
          seen.add(y);
          next.push(y);
        }
      }
    }
    frontier = next;
  }
  return seen;
}

// Recompute the focus; in the file-level view a symbol centre expands the files of the
// focused symbols (a file or external centre never expands anything).
function refocus() {
  if (!state.center) return;
  state.focus = bfs(state.center, state.hops);
  const c = byId.get(state.center);
  if (D.lod && c && SYMBOL_KINDS.has(c.kind)) {
    for (const id of state.focus) {
      const n = byId.get(id);
      if (n && SYMBOL_KINDS.has(n.kind) && n.file) state.expanded.add(n.file);
    }
  }
}

function focusOn(id) {
  state.selected = state.center = id;
  refocus();
}

// Double-click on a file in the file-level view: expand it to its symbols or collapse it
// again; the focus is cleared. Anything else is left untouched (returns null).
function toggleExpand(id) {
  const n = byId.get(id);
  if (!D.lod || !n || n.kind !== "file") return null;
  state.center = state.focus = null;
  if (state.expanded.has(id)) {
    state.expanded.delete(id);
    return "collapsed";
  }
  state.expanded.add(id);
  return "expanded";
}

// Search: tiers 1 name == q, 2 name starts with q, 3 name contains q, 4 id contains q,
// 5 signature contains q; ties by degree (high first), then id. Returns at most MAX_RESULTS ids.
function rank(q) {
  q = String(q).trim().toLowerCase();
  if (!q) return [];
  const hits = [];
  for (const k of searchKeys) {
    const tier = k.name === q ? 1 : k.name.startsWith(q) ? 2 : k.name.includes(q) ? 3 :
                 k.lid.includes(q) ? 4 : k.sig.includes(q) ? 5 : 0;
    if (tier) hits.push([tier, k]);
  }
  hits.sort((a, b) => a[0] - b[0] || b[1].deg - a[1].deg || (a[1].id < b[1].id ? -1 : a[1].id > b[1].id ? 1 : 0));
  return hits.slice(0, MAX_RESULTS).map(h => h[1].id);
}

// Every edge touching id, by panel section: {section: [[otherId, confidence], ...]} sorted by id.
function relations(id) {
  const out = {};
  for (const k of REL_ORDER) out[k] = [];
  for (const e of D.edges) {
    const r = REL[e.kind];
    if (!r) continue;
    if (e.from === id) out[r[0]].push([e.to, e.confidence]);
    if (e.to === id) out[r[1]].push([e.from, e.confidence]);
  }
  const cmp = (a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0);
  for (const k of REL_ORDER) out[k].sort(cmp);
  return out;
}

// Group ids in numeric order (g1, g2, g10), then as text.
function gidCmp(a, b) {
  const x = /\d+/.exec(a), y = /\d+/.exec(b);
  if (x && y && Number(x[0]) !== Number(y[0])) return Number(x[0]) - Number(y[0]);
  return a < b ? -1 : a > b ? 1 : 0;
}

// The LLM groups of semantic.json as legend rows (no DOM): {gid, name, summary, members, files, model, stale}.
function groupRows() {
  const groups = (D.sem && D.sem.groups) || {};
  return Object.keys(groups).sort(gidCmp).map(gid => {
    const g = groups[gid] || {};
    const members = Array.isArray(g.members) ? g.members : [];
    return {gid, name: g.name || gid, summary: g.summary || "", members, files: members.length,
            model: g.model || null, stale: !!g.stale};
  });
}

// Index of the group holding the node's file (a file: itself), -1 when none.
function groupIndex(n) {
  if (!n) return -1;
  const i = groupOf.get(n.file || n.id);
  return i === undefined ? -1 : i;
}

function groupHeading() {
  const models = [...new Set(groupRows().map(r => r.model).filter(Boolean))].sort();
  return "Groups - LLM-generated" + (models.length ? ", model " + models.join(", ") : "");
}

// The colour to send with a node position update (both modes): vis re-applies the group style to a
// node updated without a colour, so with semantic.json the LLM colour travels with every position.
// {} without semantic.json and for page-only folders.
function llmColour(id) {
  const n = byId.get(id);
  return D.sem && n ? {color: nodeColor(n, llmOn)} : {};
}

// Node colour: the group palette while the LLM layer is on (and groups exist), else the kind colour.
function nodeColor(n, on) {
  if (!on || !groupOf.size || n.kind === "external") return KIND_COLOR[n.kind] || BUNDLE_COLOR;
  const i = groupIndex(n);
  return i < 0 ? INK.noGroup : INK.groups[i % INK.groups.length];
}

// The ids a fit may use: only loaded ones (vis throws on ids that are not in the view), as an array.
function fitIds(V) {
  if (state.focus) return [...state.focus].filter(id => V.nodes.has(id));
  return V.nodes.has(state.selected) ? [state.selected] : [];
}

// Deep link "#node=<id>&hops=N": the id is percent-encoded (ids hold "/", ":" and ".").
// parseHash -> {node, hops} with hops clamped to 1-3 (missing or not a number: 1), or null when
// there is no node or the id is not in the graph. Never throws (URLSearchParams decodes leniently).
function parseHash(h) {
  const p = new URLSearchParams(String(h || "").replace(/^#/, ""));
  const node = p.get("node");
  if (!node || !byId.has(node)) return null;
  const n = Number.parseInt(p.get("hops"), 10);
  return {node, hops: Number.isNaN(n) ? 1 : Math.min(3, Math.max(1, n))};
}

function hashFor(id, hops) {
  return "#node=" + encodeURIComponent(id) + "&hops=" + hops;
}

// ---------------------------------------------------------------- DOM / vis (called from start() and handlers)

// A new element with an optional class and plain text (textContent, never markup).
function el(tag, cls, text) {
  const x = document.createElement(tag);
  if (cls) x.className = cls;
  if (text !== undefined && text !== null) x.textContent = String(text);
  return x;
}

// Show the Details or the Architecture tab of the panel (hidden attribute) and remember it.
function showTab(name) {
  if (name === "arch" && document.getElementById("tab-arch").hidden) name = "details";
  activeTab = name === "arch" ? "arch" : "details";
  document.getElementById("details").hidden = activeTab !== "details";
  document.getElementById("arch").hidden = activeTab !== "arch";
  document.getElementById("tab-details").classList.toggle("active", activeTab === "details");
  document.getElementById("tab-arch").classList.toggle("active", activeTab === "arch");
}

// Select a node: panel first, then focus + refresh, then (fit = true) fit the loaded focus ids.
// A canvas click passes fit = false so the view never moves under the pointer.
function pick(id, fit = true) {
  if (!byId.has(id)) return;
  renderDetails(id);
  showTab("details");
  focusOn(id);
  const V = refresh();
  net.selectNodes([id]);
  if (fit) net.fit({nodes: fitIds(V)});
  setHash(id);
}

// Mirror the focus centre and hops in the address bar (replaceState: no new history entry and
// no hashchange event); null removes the hash. The deep link is optional: a URL that cannot be
// rewritten (e.g. a sandboxed or srcdoc frame) must never break pick or Clear.
function setHash(id) {
  try {
    history.replaceState(null, "", id ? hashFor(id, state.hops) : location.href.split("#")[0]);
  } catch (err) {
    // no deep link for this page
  }
}

// Set the hop count (1-3) and mark its button.
function setHops(n) {
  state.hops = n;
  document.querySelectorAll("button[data-hops]")
    .forEach(b => b.classList.toggle("active", Number(b.dataset.hops) === n));
}

// Apply the deep link in the address bar: hops first, then pick (panel + focus + fit).
// No hash, or an id that is not in the graph: nothing happens.
function applyHash() {
  const h = parseHash(location.hash);
  if (!h) return;
  setHops(h.hops);
  pick(h.node);
}

// The Details tab: what the node is, the LLM file summary (labelled, hideable) and its
// relations; every related id is a button that picks it. Plain text only.
function renderDetails(id) {
  const n = byId.get(id);
  const box = document.getElementById("details");
  const out = [el("h3", "", n.label), el("div", "meta", n.kind + "  " + n.id)];
  if (n.signature) out.push(el("div", "meta", n.signature));
  if (n.file) out.push(el("div", "meta", n.file + (n.line !== null && n.line !== undefined ? ":" + n.line : "")));
  if (n.doc) out.push(el("div", "doc", n.doc));
  const f = D.sem && D.sem.files ? D.sem.files[fileOf(id)] : null;
  if (f) {
    const block = el("div", "llm llm-block");
    const head = el("h3", "", "File summary - LLM-generated, model " + (f.model || "unknown"));
    if (f.stale) head.appendChild(el("span", "badge stale", "stale"));
    block.appendChild(head);
    if (f.role) block.appendChild(el("div", "meta", "role: " + f.role));
    if (f.summary) block.appendChild(el("p", "", f.summary));
    out.push(block);
  }
  const rel = relations(id);
  for (const section of REL_ORDER) {
    if (!rel[section].length) continue;
    out.push(el("h3", "", section + " (" + rel[section].length + ")"));
    const ul = el("ul", "rel");
    for (const [other, conf] of rel[section]) {
      const b = el("button", "", other);
      b.type = "button";
      b.addEventListener("click", () => pick(other));
      const badge = el("span", "badge", conf);
      badge.dataset.conf = conf;
      const li = el("li");
      li.appendChild(b);
      li.appendChild(badge);
      ul.appendChild(li);
    }
    out.push(ul);
  }
  box.replaceChildren(...out);
}

// One switch for the whole LLM layer: every .llm element (file summaries, group legend,
// Architecture tab) and the group colours; off = structural kind colours.
function setLLM(on) {
  llmOn = on;
  document.body.classList.toggle("llm-off", !on);
  nodes.update(D.nodes.map(n => ({id: n.id, color: nodeColor(n, on)})));
  if (tnodes) tnodes.update(D.nodes.map(n => ({id: n.id, color: nodeColor(n, on)})));
  if (!on && activeTab === "arch") showTab("details");
}

// Legend swatch colour of group index gi (-1 = no group), as nodeColor() paints its files.
function swatchColour(gi) {
  return gi < 0 ? INK.noGroup : INK.groups[gi % INK.groups.length];
}

// Legend section of the LLM groups (class llm): heading, then per group swatch, name,
// file count, stale mark and its summary. Only built when semantic.json has groups.
function renderGroupLegend() {
  const rows = groupRows();
  if (!rows.length) return;
  const sec = el("div", "llm");
  sec.appendChild(el("h3", "", groupHeading()));
  const row = (gi, name, count, stale) => {
    const r = el("div", "grow");
    const sw = el("span", "sw");
    sw.style.background = swatchColour(gi);
    groupSwatches.push([sw, gi]);
    r.appendChild(sw);
    r.appendChild(el("span", "", name));
    if (stale) r.appendChild(el("span", "badge stale", "stale"));
    r.appendChild(el("span", "count", count));
    return r;
  };
  rows.forEach((g, i) => {
    sec.appendChild(row(i, g.name,
                        g.files + (g.files === 1 ? " file" : " files"), g.stale));
    if (g.summary) sec.appendChild(el("div", "llm gsum", g.summary));
  });
  const loose = D.nodes.filter(n => n.kind === "file" && groupIndex(n) < 0).length;
  if (loose) sec.appendChild(row(-1, "no group", loose + (loose === 1 ? " file" : " files"), false));
  document.getElementById("legend").appendChild(sec);
}

// The Architecture tab (class llm): overview, patterns and decisions; every evidence id is a
// chip that picks (focuses and fits) its node. Shown only when semantic.json has one.
function renderArch() {
  const a = D.sem && D.sem.architecture;
  if (!a) return;
  const head = el("h3", "", "Architecture - LLM-generated, model " + (a.model || "unknown"));
  if (a.stale) head.appendChild(el("span", "badge stale", "stale"));
  const out = [head];
  if (a.overview) out.push(el("p", "", a.overview));
  const section = (title, list, nameKey, textKey) => {
    if (!Array.isArray(list) || !list.length) return;
    out.push(el("h3", "", title));
    for (const it of list) {
      const item = el("div", "item");
      item.appendChild(el("strong", "", (it && it[nameKey]) || ""));
      if (it && it[textKey]) item.appendChild(el("p", "", it[textKey]));
      const chips = el("div");
      for (const id of (it && Array.isArray(it.evidence)) ? it.evidence : []) {
        const b = el("button", "chip", id);
        b.type = "button";
        b.addEventListener("click", () => pick(id));
        chips.appendChild(b);
      }
      item.appendChild(chips);
      out.push(item);
    }
  };
  section("Patterns", a.patterns, "name", "explanation");
  section("Decisions", a.decisions, "decision", "rationale");
  const dropped = Array.isArray(a.dropped) ? a.dropped.length : 0;
  if (dropped) {
    out.push(el("p", "hint", dropped === 1 ? "1 evidence id not found in graph.json was dropped"
                                           : dropped + " evidence ids not found in graph.json were dropped"));
  }
  document.getElementById("arch").replaceChildren(...out);
  document.getElementById("tab-arch").hidden = false;
}

// Search result rows (li > button: label, kind, id) built in a DocumentFragment; returns the ids.
function renderResults(q) {
  const ids = rank(q);
  const frag = document.createDocumentFragment();
  for (const id of ids) {
    const n = byId.get(id);
    const b = el("button", "row");
    b.type = "button";
    b.appendChild(el("span", "label", n.label));
    b.appendChild(el("span", "kind", n.kind));
    b.appendChild(el("span", "rid", id));
    b.addEventListener("click", () => pick(id));
    const li = el("li");
    li.appendChild(b);
    frag.appendChild(li);
  }
  if (!ids.length && String(q).trim()) frag.appendChild(el("li", "hint", "no match"));
  document.getElementById("results").replaceChildren(frag);
  return ids;
}

function renderLegend(V) {
  const c = legendCounts(V);
  document.querySelectorAll("#legend input[data-node-kind], #legend input[data-edge-kind], #legend input[data-conf]")
    .forEach(cb => {
      const d = cb.dataset;
      const n = d.nodeKind ? c.node[d.nodeKind] : d.edgeKind ? c.edge[d.edgeKind] : c.conf[d.conf];
      const span = cb.parentNode.querySelector(".count");
      if (span) span.textContent = String(n);
    });
  const shownEdges = CONFS.reduce((sum, k) => sum + c.conf[k], 0);
  setStatus(V.nodes.size + " nodes, " + shownEdges + " edges shown (" + c.lines + " lines)" +
            (D.note ? " - " + D.note : ""));
}

// Re-apply state to the network: ring-place the symbols of newly expanded files, remember
// where loaded nodes are, recompute the visible sets, refresh the views, legend and status.
// Tree mode has its own refresh (tree positions, Tree DataSets).
function refresh() {
  if (mode === "tree") return refreshTree();
  const pos = net.getPositions();
  const ring = [];
  for (const file of state.expanded) {
    if (placed.has(file)) continue;
    const ids = (symbolsOf.get(file) || []).filter(id => !pos[id]);
    const at = pos[file] || nodes.get([file])[0] || {};
    const cx = at.x || 0, cy = at.y || 0, r = 60 + 6 * ids.length;
    ids.forEach((id, i) => {
      const a = 2 * Math.PI * i / ids.length;
      ring.push({id, x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)});
    });
  }
  placed = new Set(state.expanded);
  nodes.update(Object.keys(pos).map(id => ({id, x: pos[id].x, y: pos[id].y})).concat(ring)
    .map(u => ({...u, ...llmColour(u.id)})));
  const V = applyView();
  shown = V;
  if (D.lod) edges.update(D.file_edges.map(f => ({id: f.id, ...bundleStyle(f)})));
  nodeView.refresh();
  edgeView.refresh();
  renderLegend(V);
  return V;
}

function clearFocus() {
  state.center = state.focus = null;
  refresh();
  setHash(null);
}

// The only place physics is switched on again; it goes off once stable or after RELAYOUT_MS.
// In Tree mode Re-layout re-applies the tree positions instead (physics stays off there).
function relayout() {
  if (mode === "tree") {
    refresh();
    return;
  }
  const stop = () => net.setOptions({physics: {enabled: false}});
  net.setOptions({physics: {enabled: true}});
  net.once("stabilized", stop);
  setTimeout(stop, RELAYOUT_MS);
}

function setStatus(text, error) {
  const el = document.getElementById("status");
  el.textContent = text;
  if (error) el.classList.add("error");
}

function cdnFailed() {
  setStatus("Could not load vis-network 9.1.9 from unpkg.com or cdn.jsdelivr.net (offline or blocked): " +
            "the graph cannot be drawn.", true);
}

function start() {
  nodes = new vis.DataSet(D.nodes);
  edges = new vis.DataSet(D.edges.concat(D.file_edges.map(f => ({id: f.id, from: f.from, to: f.to,
                                                                  ...bundleStyle(f)}))));
  shown = applyView();
  placed = new Set(state.expanded);
  nodeView = new vis.DataView(nodes, {filter: n => shown.nodes.has(n.id)});
  edgeView = new vis.DataView(edges, {filter: e => shown.raw.has(e.id) || shown.agg.has(e.id)});
  const shownNodes = shown.nodes.size;
  net = new vis.Network(document.getElementById("net"), {nodes: nodeView, edges: edgeView}, {
    layout: {improvedLayout: shownNodes <= 150},
    physics: {solver: "forceAtlas2Based",
              stabilization: {iterations: shownNodes > 300 ? 100 : 300, updateInterval: 25}},
    edges: {arrows: {to: {enabled: true, scaleFactor: 0.5}}, smooth: false},
    nodes: {shape: "dot", size: 10, font: nodeFont(), chosen: nodeChosen()},
    groups: GRAPH_GROUPS,
    interaction: {hover: true, tooltipDelay: 150, hideEdgesOnDrag: D.lod, hideEdgesOnZoom: D.lod}
  });
  // Lay out once, then stop: physics stays off (expand, collapse and filters never turn it on).
  net.on("stabilizationProgress", p => setStatus("Laying out " + p.iterations + " / " + p.total + " ..."));
  net.once("stabilizationIterationsDone", () => {
    net.setOptions({physics: {enabled: false}});
    renderLegend(shown);
    applyHash();
  });
  renderLegend(shown);

  net.on("doubleClick", p => { if (p.nodes.length && toggleExpand(p.nodes[0]) !== null) refresh(); });
  const collapseAll = document.getElementById("collapse-all");
  collapseAll.hidden = !D.lod;
  collapseAll.addEventListener("click", () => {
    state.expanded.clear();
    state.center = state.focus = null;
    refresh();
  });
  document.getElementById("relayout").addEventListener("click", relayout);

  document.querySelectorAll("button[data-hops]").forEach(b => b.addEventListener("click", () => {
    setHops(Number(b.dataset.hops));
    refocus();
    refresh();
    if (state.center) setHash(state.center);
  }));
  // Deep link: an edited hash (or back/forward to one) is applied again.
  window.addEventListener("hashchange", applyHash);
  document.getElementById("clear-focus").addEventListener("click", clearFocus);
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") clearFocus(); });
  document.querySelectorAll("#legend input[data-node-kind], #legend input[data-edge-kind], #legend input[data-conf]")
    .forEach(cb => cb.addEventListener("change", () => {
      const d = cb.dataset;
      const set = d.nodeKind ? state.kinds : d.edgeKind ? state.ekinds : state.conf;
      const key = d.nodeKind || d.edgeKind || d.conf;
      if (cb.checked) set.add(key); else set.delete(key);
      refocus();
      refresh();
    }));
  document.getElementById("fit").addEventListener("click", () => net.fit());

  // Canvas click: select + panel + focus, no viewport move (a double-click still lands on the node).
  net.on("click", p => { if (p.nodes.length) pick(p.nodes[0], false); });
  const search = document.getElementById("search");
  let timer = null;
  search.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => renderResults(search.value), DEBOUNCE_MS);
  });
  search.addEventListener("keydown", ev => {
    if (ev.key !== "Enter") return;
    clearTimeout(timer);
    const ids = renderResults(search.value);
    if (ids.length) pick(ids[0]);
  });
  document.getElementById("tab-details").addEventListener("click", () => showTab("details"));
  document.getElementById("tab-arch").addEventListener("click", () => showTab("arch"));
  showTab("details");

  // LLM layer (only with semantic.json): labelled, hideable with one checkbox.
  if (D.sem) {
    renderGroupLegend();
    renderArch();
    const toggle = document.getElementById("llm-toggle");
    const box = document.querySelector("#llm-toggle input");
    toggle.hidden = false;
    box.checked = true;
    setLLM(true);
    box.addEventListener("change", ev => setLLM(ev.target.checked));
  }
  initModes();
}

// ---------------------------------------------------------------- Tree mode (Graph | Tree buttons)

// Graph | Tree buttons. Tree is enabled once the graph's first layout is done, so the Phase 8
// stabilization handler always runs while Graph is shown.
function initModes() {
  const treeButton = document.getElementById("mode-tree");
  treeButton.disabled = true;
  net.once("stabilizationIterationsDone", () => { treeButton.disabled = false; });
  document.getElementById("mode-graph").addEventListener("click", () => setMode("graph"));
  treeButton.addEventListener("click", () => setMode("tree"));
}

// moveTo options that open a w x h canvas like an editor: graph point (-COL/2, -ROW) (just above
// and left of the first row) at the top-left corner, 100% zoom.
function topView(w, h) {
  return {position: {x: w / 2 - COL / 2, y: h / 2 - ROW}, scale: 1};
}

// Show Graph or Tree. The view left keeps its camera and positions (leaving Graph switches its
// physics off, which stops a running Re-layout). The view shown is synced to the shared state
// (refresh), gets the selection and, when the selection changed while it was hidden, fits the
// focus like pick(); Tree is built on first use and then opens at the top of the tree.
function setMode(m) {
  if (m === mode || (m === "tree" && document.getElementById("mode-tree").disabled)) return;
  seenSel[mode] = state.selected;
  if (mode === "graph") {
    graphNet = net;
    net.setOptions({physics: {enabled: false}});
  }
  mode = m;
  document.getElementById("net").classList.toggle("off", m !== "graph");
  document.getElementById("tree").classList.toggle("off", m !== "tree");
  document.getElementById("mode-graph").classList.toggle("active", m === "graph");
  document.getElementById("mode-tree").classList.toggle("active", m === "tree");
  const first = m === "tree" && !tnet;
  if (first) startTree();
  net = m === "tree" ? tnet : graphNet;
  const V = refresh();
  if (V.nodes.has(state.selected)) net.selectNodes([state.selected]);
  else net.unselectAll();
  if (state.selected !== seenSel[m] && fitIds(V).length) {
    net.fit({nodes: fitIds(V)});
  } else if (first) {
    const box = document.getElementById("tree");
    net.moveTo(topView(box.clientWidth, box.clientHeight));
  }
}

// Tree mode's own DataSets, views and network (physics off, positions from treeLayout).
function startTree() {
  tnodes = new vis.DataSet(treeNodeItems());
  tedges = new vis.DataSet(treeEdgeItems());
  tshown = applyView();
  placeTree(tshown);
  tnodeView = new vis.DataView(tnodes, {filter: n => tshown.nodes.has(n.id) || tree.dirs.has(n.id)});
  tedgeView = new vis.DataView(tedges, {filter: e => tshown.raw.has(e.id) || tshown.agg.has(e.id) ||
                                                     tree.branches.has(e.id)});
  tnet = new vis.Network(document.getElementById("tree"), {nodes: tnodeView, edges: tedgeView}, {
    layout: {improvedLayout: false},
    physics: {enabled: false},
    edges: {arrows: {to: {enabled: true, scaleFactor: 0.5}}, smooth: false},
    nodes: {shape: "dot", size: 10, font: nodeFont(), chosen: nodeChosen()},
    groups: treeGroups(),
    interaction: {hover: true, tooltipDelay: 150, hideEdgesOnDrag: D.lod, hideEdgesOnZoom: D.lod}
  });
  tnet.on("doubleClick", p => { if (p.nodes.length && toggleExpand(p.nodes[0]) !== null) refresh(); });
  tnet.on("click", p => { if (p.nodes.length) pick(p.nodes[0], false); });
}

// Put the shown nodes and their folders at their tree places (before the views let them in).
function placeTree(V) {
  tree = treeLayout(V);
  tnodes.update(Object.entries(tree.pos).map(([id, p]) => ({id, x: p.x, y: p.y, ...llmColour(id)})));
}

// refresh() in Tree mode: visible sets -> tree positions -> Tree views, legend and status.
function refreshTree() {
  const V = applyView();
  tshown = V;
  placeTree(V);
  if (D.lod) tedges.update(D.file_edges.map(f => ({id: f.id, ...bundleStyle(f)})));
  tnodeView.refresh();
  tedgeView.refresh();
  renderLegend(V);
  return V;
}

// vis from unpkg (static tag above); if it did not load, try jsDelivr once, then say so.
function boot() {
  if (typeof vis === "undefined") {
    const s = document.createElement("script");
    s.src = JSDELIVR_URL;
    s.integrity = JSDELIVR_SRI;
    s.crossOrigin = "anonymous";
    s.onload = () => { if (typeof vis === "undefined") cdnFailed(); else start(); };
    s.onerror = cdnFailed;
    setStatus("Loading vis-network 9.1.9 from cdn.jsdelivr.net ...");
    document.head.appendChild(s);
  } else {
    start();
  }
}

// ---------------------------------------------------------------- Theme (Auto | Light | Dark)

// The Theme select shows the saved choice; a change, or an OS switch while on Auto, restyles.
function initTheme() {
  setThemeAttr();
  const select = document.getElementById("theme");
  select.value = themePref;
  select.addEventListener("change", ev => setTheme(ev.target.value));
  if (DARK_MQ && DARK_MQ.addEventListener) {
    DARK_MQ.addEventListener("change", () => { if (themePref === "auto") applyTheme(); });
  }
}

// <html data-theme>: absent on Auto (the CSS media query decides), else the chosen theme.
function setThemeAttr() {
  const root = document.documentElement;
  if (!root) return;
  if (themePref === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", themePref);
}

function setTheme(pref) {
  themePref = pref === "light" || pref === "dark" ? pref : "auto";
  document.getElementById("theme").value = themePref;
  try {
    localStorage.setItem(THEME_KEY, themePref);
  } catch (e) {
    // no storage: the choice lasts until the page is closed
  }
  applyTheme();
}

// Restyle for the current choice: the CSS follows data-theme; on both canvases the label font,
// selection look, folder boxes, branch lines and LLM colours change, and the group swatches. The
// positions are written back first, because the groups option makes vis re-read every node from
// its DataSet (the colour travels with them, as in refresh()).
function applyTheme() {
  DARK = isDark(themePref);
  INK = INKS[DARK ? "dark" : "light"];
  setThemeAttr();
  for (const e of D.edges) if (e.kind === "contains") e.color = INK.branch;
  for (const b of BRANCH_EDGES) b.color = INK.branch;
  const contains = D.edges.filter(e => e.kind === "contains").map(e => e.id);
  const look = {nodes: {font: nodeFont(), chosen: nodeChosen()}};
  const views = [[mode === "graph" ? net : graphNet, nodes, edges, GRAPH_GROUPS, contains],
                 [tnet, tnodes, tedges, treeGroups(), contains.concat(BRANCH_EDGES.map(b => b.id))]];
  for (const [network, ds, es, groups, branchIds] of views) {
    if (!network) continue;
    const pos = network.getPositions();
    if (D.sem) ds.update(D.nodes.map(n => ({id: n.id, color: nodeColor(n, llmOn)})));
    ds.update(Object.keys(pos).map(id => ({id, x: pos[id].x, y: pos[id].y, ...llmColour(id)})));
    es.update(branchIds.map(id => ({id, color: INK.branch})));
    network.setOptions({...look, groups});
  }
  for (const [sw, gi] of groupSwatches) sw.style.background = swatchColour(gi);
}

initTheme();
boot();
</script>
